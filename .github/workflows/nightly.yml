name: Nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      # Use the RustSec action to avoid compiling cargo-audit from source on
      # every run. Local `make preflight` remains stricter with `--deny warnings`.
      - name: Audit dependencies
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        # See .github/workflows/ci.yml for pinning rationale.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-17
        with:
          components: llvm-tools-preview

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-llvm-cov
        run: cargo binstall cargo-llvm-cov --no-confirm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nightly-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Coverage summary
        run: cargo llvm-cov --summary-only
