name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect non-doc changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!_docs/**'
              - '!README*'
              - '!CHANGELOG*'

  test:
    name: build + test + lint
    needs: changes
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Skip Rust checks for docs-only PR
        if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
        run: echo "Only documentation paths changed; build, test, and lint are covered by non-doc PRs and pushes."

      - name: Install Rust stable
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        # dtolnay/rust-toolchain ships its versions as branch tips, not tagged releases,
        # so we pin the `stable` branch HEAD by commit SHA. Bump deliberately when the
        # upstream toolchain bump matters; see docs/research/aikido-sca.md.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-17
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        run: cargo fmt --check

      # `--all-targets` includes benches and integration tests so the CI lint
      # surface matches `make preflight` (see CLAUDE.md > Branch Policy).
      - name: Clippy
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        run: cargo test --all-features

  msrv:
    name: MSRV check (Cargo.toml rust-version)
    needs: changes
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Skip MSRV for docs-only PR
        if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
        run: echo "Only documentation paths changed; MSRV build is skipped for this PR."

      - name: Read rust-version from Cargo.toml
        id: msrv
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          rv=$(awk -F'"' '/^rust-version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ -z "${rv}" ]; then
            echo "Cargo.toml is missing [package].rust-version" >&2
            exit 1
          fi
          echo "version=${rv}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}

      # Build (not test) on the declared MSRV — proves the pinned rust-version
      # is honest. Tests stay on stable so the matrix doesn't double its cost.
      - name: Build on MSRV
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        run: cargo build --tests --all-features

  audit:
    name: security audit
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip audit for PRs
        if: github.event_name == 'pull_request'
        run: echo "Cargo audit runs on protected-branch pushes and in the scheduled nightly workflow."

      # Use the RustSec action to avoid compiling cargo-audit from source on
      # every run. Local `make preflight` remains stricter with `--deny warnings`.
      - name: Audit dependencies
        if: github.event_name != 'pull_request'
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          # Use the upstream installer pinned to TRIVY_VERSION so CI and
          # `make trivy` resolve to the same binary. The Aqua apt repo only
          # carries a short window of recent versions (~last 6 months), so
          # pinning to an older release via `apt-get install trivy=X.Y.Z`
          # silently fails on the GitHub runner.
          #
          # Fetch the installer from the release tag (not /main/) so the
          # script and the binary it installs come from the same auditable
          # artifact, and download to a file first so a `curl` failure
          # surfaces directly instead of being masked by the pipe.
          set -euo pipefail
          installer_url="https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh"
          installer_path="$(mktemp)"
          trap 'rm -f "${installer_path}"' EXIT
          curl -fsSL "${installer_url}" -o "${installer_path}"
          sudo sh "${installer_path}" -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: Cache Trivy DB
        id: cache-trivy-db
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          # DB updates roughly every 6h on the Aqua side; refresh the cache
          # daily and fall back to the most recent run-of-the-day if the
          # exact key misses.
          key: ${{ runner.os }}-trivy-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy vulnerability scan
        run: trivy fs --format sarif --output trivy-results.sarif .

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  semgrep:
    name: semgrep scan
    runs-on: ubuntu-latest
    # Pinned tag keeps CI deterministic across Semgrep releases (rule
    # additions / exit-code changes) — bump intentionally to refresh rules.
    container:
      image: semgrep/semgrep:1.124.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config p/default --error

  coverage:
    name: test coverage
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip coverage for PRs
        if: github.event_name == 'pull_request'
        run: echo "Coverage runs on protected-branch pushes and in the scheduled nightly workflow."

      - name: Install Rust stable
        if: github.event_name != 'pull_request'
        # See comment in `build + test + lint` job above for pinning rationale.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-17
        with:
          components: llvm-tools-preview

      - name: Install cargo-binstall
        if: github.event_name != 'pull_request'
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-llvm-cov
        if: github.event_name != 'pull_request'
        run: cargo binstall cargo-llvm-cov --no-confirm

      - name: Cache cargo
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Coverage summary
        if: github.event_name != 'pull_request'
        run: cargo llvm-cov --all-features --summary-only
