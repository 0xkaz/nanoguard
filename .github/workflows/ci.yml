name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test + lint
    # Matrix expands the test job across linux + macOS so platform-specific
    # build breakage in bundled deps (rusqlite, rustls) surfaces in CI rather
    # than at release time. Windows is intentionally left for a follow-up.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --tests

      - name: Test
        run: cargo test

      # `--all-targets` includes benches and integration tests so the CI lint
      # surface matches `make preflight` (see CLAUDE.md > Branch Policy).
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --check

  msrv:
    name: MSRV check (Cargo.toml rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          rv=$(awk -F'"' '/^rust-version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ -z "${rv}" ]; then
            echo "Cargo.toml is missing [package].rust-version" >&2
            exit 1
          fi
          echo "version=${rv}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}

      # Build (not test) on the declared MSRV — proves the pinned rust-version
      # is honest. Tests stay on stable so the matrix doesn't double its cost.
      - name: Build on MSRV
        run: cargo build --tests

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # `--deny warnings` so future advisories that only emit a warning still
      # fail CI instead of passing silently. Matches `make preflight`.
      - name: Audit dependencies
        run: cargo audit --deny warnings

  trivy:
    name: trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          # Use the upstream installer pinned to TRIVY_VERSION so CI and
          # `make trivy` resolve to the same binary. The Aqua apt repo only
          # carries a short window of recent versions (~last 6 months), so
          # pinning to an older release via `apt-get install trivy=X.Y.Z`
          # silently fails on the GitHub runner.
          #
          # Fetch the installer from the release tag (not /main/) so the
          # script and the binary it installs come from the same auditable
          # artifact, and download to a file first so a `curl` failure
          # surfaces directly instead of being masked by the pipe.
          set -euo pipefail
          installer_url="https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh"
          installer_path="$(mktemp)"
          trap 'rm -f "${installer_path}"' EXIT
          curl -fsSL "${installer_url}" -o "${installer_path}"
          sudo sh "${installer_path}" -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: Cache Trivy DB
        id: cache-trivy-db
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          # DB updates roughly every 6h on the Aqua side; refresh the cache
          # daily and fall back to the most recent run-of-the-day if the
          # exact key misses.
          key: ${{ runner.os }}-trivy-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy vulnerability scan
        run: trivy fs --format sarif --output trivy-results.sarif .

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  semgrep:
    name: semgrep scan
    runs-on: ubuntu-latest
    # Pinned tag keeps CI deterministic across Semgrep releases (rule
    # additions / exit-code changes) — bump intentionally to refresh rules.
    container:
      image: semgrep/semgrep:1.124.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config p/default --error

  coverage:
    name: test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Coverage summary
        run: cargo llvm-cov --summary-only
