[package]
name = "nanoguard"
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
description = "Nano-fast CPU-only offline-first LLM guardrails proxy"
license = "MIT"

[lib]
name = "nanoguard"
path = "src/lib.rs"

[[bin]]
name = "nanoguard"
path = "src/main.rs"

[[bin]]
name = "nanoguard-eval"
path = "src/bin/nanoguard-eval.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `toml_edit` is already in the dep graph as a transitive of `toml`;
# we pull it in explicitly so the Console can rewrite [backends.*]
# round-trippable (other sections of nanoguard.toml stay verbatim).
toml_edit = "0.22"
iword-rs = { version = "0.1", features = ["regex"] }
aho-corasick = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
unicode-normalization = "0.1"
jsonschema = { version = "0.30", default-features = false }
serde_yaml = "0.9"
arc-swap = "1"
subtle = "2"
rand = "0.8"
argon2 = "0.5"
cookie = { version = "0.18", features = ["signed", "percent-encode", "key-expansion"] }
hex = "0.4"
libc = "0.2"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "guardrails"
harness = false

[[bench]]
name = "aho_vs_iword"
harness = false

[[bench]]
name = "engine_compare"
harness = false
